name: oj-platform-e2e
services:
  mysql:
    image: mysql:8.0.44@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714
    # The pinned C++ Connector 1.x requires legacy authentication in this isolated SUT.
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_DATABASE: oj_platform_e2e
      MYSQL_USER: oj_e2e_sut
      MYSQL_PASSWORD: ${E2E_DB_PASSWORD:?Run prepare_sut.ps1 and use --env-file .env.e2e}
      MYSQL_ROOT_PASSWORD: ${E2E_ROOT_PASSWORD:?Missing isolated MySQL root password}
    volumes:
      - e2e-mysql:/var/lib/mysql
      - ./.cache/e2e/init.sql:/docker-entrypoint-initdb.d/10-e2e.sql:ro
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -Nse 'SELECT COUNT(*) FROM e2e_scope' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
  cpp-oj:
    build:
      context: .
      dockerfile: infra/cpp-oj.Dockerfile
      additional_contexts:
        sut: ./.cache/cpp-oj
      args:
        SUT_SHA: ${E2E_SUT_SHA:?Missing pinned source revision}
    environment:
      E2E_DB_PASSWORD: ${E2E_DB_PASSWORD:?Missing isolated MySQL password}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:?Missing isolated admin password}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [e2e]
    read_only: true
    tmpfs:
      - /runtime:uid=10001,gid=10001,mode=0700
      - /tmp:exec,size=268435456,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    init: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/login',timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 20
  gateway:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "10001:10001"
    depends_on:
      cpp-oj:
        condition: service_healthy
    ports: ["127.0.0.1:18090:8080"]
    networks: [e2e, ingress]
    volumes:
      - ./infra/e2e-nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=16777216"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/login"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  e2e-mysql:
networks:
  e2e:
    internal: true
  ingress: {}
