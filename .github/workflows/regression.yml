name: Platform regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Run regression tests
        run: python -m pytest -m "not e2e" -q --junitxml=artifacts/junit.xml
      - name: Generate HTTP Mock demo reports
        if: always()
        run: python -m scripts.ci_demo --output-dir artifacts/demo --platform-sha "$GITHUB_SHA"
      - name: Validate test and report evidence
        if: always()
        run: python -m scripts.check_evidence --junit artifacts/junit.xml --demo artifacts/demo/manifest.json --expected-sha "$GITHUB_SHA" --output artifacts/evidence.json
      - name: Archive regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-python-${{ matrix.python }}-${{ github.sha }}
          path: |
            artifacts/junit.xml
            artifacts/demo/*.json
            artifacts/demo/*.html
            artifacts/evidence.json
          if-no-files-found: error
          retention-days: 14

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM_SHA: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: oj-ci-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start isolated demo
        run: |
          mkdir -p artifacts/docker
          docker compose --profile demo build
          docker compose --profile demo up -d --wait platform mock-oj
      - name: Exercise HTTP task and verify persistence after recreation
        run: |
          docker compose --profile demo run --rm smoke --phase create
          docker compose down
          docker compose --profile demo up -d --wait platform mock-oj
          docker compose --profile demo run --rm smoke --phase verify
      - name: Collect Docker smoke manifest
        if: always()
        run: docker compose --profile demo run --rm --no-deps --entrypoint python smoke -c "print(open('/evidence/smoke.json').read())" > artifacts/docker/smoke.json
      - name: Collect Docker task reports
        if: always()
        run: docker compose cp platform:/data/reports artifacts/docker/reports
      - name: Collect Docker diagnostics
        if: always()
        run: |
          mkdir -p artifacts/docker
          docker compose ps --format json > artifacts/docker/services.json
          docker compose logs --no-color > artifacts/docker/compose.log
      - name: Archive Docker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-smoke-${{ github.sha }}
          path: artifacts/docker/
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated demo
        if: always()
        run: docker compose down

  real-cpp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_TERMINAL_PROMPT: '0'
      OJ_PLATFORM_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip check
      - name: Prepare pinned public SUT and isolated credentials
        run: |
          python -m scripts.prepare_e2e
          python - <<'PY'
          from pathlib import Path
          for line in Path('.env.e2e').read_text().splitlines():
              key, value = line.split('=', 1)
              if 'PASSWORD' in key:
                  print('::add-mask::' + value)
          PY
      - name: Build and start real compiler and MySQL
        run: |
          docker compose --env-file .env.e2e -f compose.e2e.yaml build
          docker compose --env-file .env.e2e -f compose.e2e.yaml up -d --wait
          python -m scripts.e2e_environment --evidence artifacts/e2e-environment.json
      - name: Run real verdict, concurrency and cancellation matrix
        run: python -m pytest tests/e2e -m e2e --run-e2e --e2e-config config_center/e2e.example.yaml -q --junitxml=artifacts/e2e-junit.xml
      - name: Collect redacted E2E reports and diagnostics
        if: always()
        run: python -m scripts.ci_e2e_artifacts --docker-logs
      - name: Archive real E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-cpp-e2e-${{ github.sha }}
          path: ci-e2e-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated real OJ
        if: always() && hashFiles('.env.e2e') != ''
        run: docker compose --env-file .env.e2e -f compose.e2e.yaml down
